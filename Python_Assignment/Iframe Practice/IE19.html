<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fullscreen Iframe Comparison</title>
</head>
<body>
	<h1>Fullscreen Permission Comparison</h1>

	<h2>Iframe</h2>
	<iframe
		src="https://www.youtube.com/embed/dQw4w9WgXcQ"
		title="Iframe with fullscreen permission"
		allow="fullscreen">
	</iframe>

	<h2>Iframe without an <code>allow</code> attribute</h2>
	<iframe
		src="https://www.youtube.com/embed/dQw4w9WgXcQ"
		title="Iframe without fullscreen permission">
	</iframe>
</body>
</html>
