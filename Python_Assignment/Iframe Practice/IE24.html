<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iframe Feature Demo</title>
</head>
<body>

      <h2>Fullscreen Access</h2>
      <iframe
        title="Fullscreen iframe example"
        src="https://example.com"
        width="300"
        height="200"
        allow="fullscreen">
      </iframe>


    
      <h2>Gyroscope Access</h2>
      <iframe
        title="Gyroscope iframe example"
        src="https://example.com"
        width="420"
        height="260"
        allow="gyroscope">
      </iframe>
    
      <h2>USB Access</h2>
      <iframe
        title="USB iframe example"
        src="https://example.com"
        width="240"
        height="160"
        allow="usb">
      </iframe>

</body>
</html>
