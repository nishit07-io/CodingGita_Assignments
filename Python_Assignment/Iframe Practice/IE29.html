<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iframe Permissions Comparison</title>
</head>
<body>
			<h2>Version A: Fullscreen Only</h2>
			<iframe
				src="https://example.com"
				allow="fullscreen"
				title="Version A iframe with fullscreen permission"></iframe>
			<h2>Version B: Fullscreen, Gyroscope, and USB</h2>
			<iframe
				src="https://example.com"
				allow="fullscreen; gyroscope; usb"
				title="Version B iframe with fullscreen, gyroscope, and USB permissions"></iframe>
</body>
</html>
