<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Permissions</title>
</head>
<body>
  <h1>Iframe Permissions Example</h1>
  <p>This page demonstrates two iframes with different permissions and sizes.</p>

  <iframe
    src="about:blank"
    title="USB-enabled iframe"
    allow="usb"
    width="500"
    height="250">
  </iframe>

  <iframe
    src="about:blank"
    title="Fullscreen-enabled iframe"
    allow="fullscreen"
    width="350"
    height="180">
  </iframe>
</body>
</html>
