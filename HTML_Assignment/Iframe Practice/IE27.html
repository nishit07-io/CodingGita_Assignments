<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Iframe Links</title>
</head>
<body>
	<ul>
		<li><a href="https://example.com" target="shared-frame">Example</a></li>
		<li><a href="https://www.wikipedia.org" target="shared-frame">Wikipedia</a></li>
		<li><a href="https://www.iana.org/domains/reserved" target="shared-frame">IANA Reserved Domains</a></li>
	</ul>

	<iframe name="shared-frame" title="Linked content" allow="fullscreen" width="600" height="400"></iframe>
</body>
</html>
