<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel 15</title>
</head>
<body>
    <table border="1">
    <caption>PUBG Mobile Map and Weapon Details</caption>
    <thead>
        <tr>
            <th id="map" scope="col">Map Name</th>
            <th id="size" scope="col">Map Size</th>
            <th id="weapon" scope="col">Popular Weapon</th>
            <th id="ammo" scope="col">Ammo Type</th>
            <th id="style" scope="col">Play Style</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row" rowspan="2">Erangel</th>
            <td headers="size">8x8 km</td>
            <td headers="weapon">M416</td>
            <td headers="ammo">5.56mm</td>
            <td headers="style" rowspan="2">Balanced / Tactical</td>
        </tr>
        <tr>
            <td headers="size">8x8 km</td>
            <td headers="weapon">AKM</td>
            <td headers="ammo">7.62mm</td>
        </tr>
        <tr>
            <th scope="row">Sanhok</th>
            <td headers="size">4x4 km</td>
            <td headers="weapon" colspan="2">Beryl M762 & QBZ Set</td>
            <td headers="style">Fast-paced / Close Range</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4">Total Maps Listed: 2 Battlegrounds</td>
            <td>Ready to Drop</td>
        </tr>
    </tfoot>
</table>
</body>
</html>
