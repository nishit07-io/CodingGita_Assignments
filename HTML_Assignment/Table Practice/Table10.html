<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 10</title>
</head>
<body>
    <table border="1">
        <caption>Quarterly Department Performance</caption>
        <thead>
            <tr>
                <th scope="col">Department</th>
                <th scope="col" id="category">Category</th>
                <th scope="col">Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Electronics</td>
                <td headers="category">Laptops</td>
                <td>$50,000</td>
            </tr>
            <tr>
                <td headers="category">Smartphones</td>
                <td>$70,000</td>
                </tr>
            <tr>
                <td>Furniture</td>
                <td headers="category">Office Chairs</td>
                <td>$30,000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total Sales</td>
                <td>$150,000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
