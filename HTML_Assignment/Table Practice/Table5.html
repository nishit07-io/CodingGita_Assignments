<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 5 </title>
</head>
<body>
    <table border="1">
        <caption>Student Performance Report</caption>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Liam</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Olivia</td>
                <td>A</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">End of Report</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
