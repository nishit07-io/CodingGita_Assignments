<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>
</head>
<body>
  <form>
    <h2>Customer Feedback</h2>

    <label for="satisfaction">Satisfaction (1–10):</label>
    <input id="satisfaction" type="range" min="1" max="10" value="7" />
    

    <p>Would you recommend us?</p>
    <label>
      <input type="radio" name="recommend" value="yes" /> Yes
    </label>
    <label>
      <input type="radio" name="recommend" value="no" /> No
    </label>

    <p>
      <label for="comments">Comments:</label><br />
      <textarea id="comments" rows="5" cols="40" placeholder="Tell us how we can improve..."></textarea>
    </p>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
