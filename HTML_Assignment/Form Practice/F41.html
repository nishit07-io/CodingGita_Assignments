<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body>
    <form method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required><br><br>
        </fieldset>

        <fieldset>
            <legend>Experience</legend>

            <label for="experience">Tell us about your experience:</label><br>
            <textarea id="experience" name="experience" rows="5" cols="40" required></textarea>
        </fieldset>

        <fieldset>
            <legend>Resume</legend>

            <label for="resume">Upload Resume (PDF only):</label>
            <input type="file" id="resume" name="resume" accept="application/pdf" required>
        </fieldset>

        <fieldset>
            <legend>Employment Type</legend>

            <label>
                <input type="radio" name="employmentType" value="full-time" required>
                Full-time
            </label><br>

            <label>
                <input type="radio" name="employmentType" value="part-time">
                Part-time
            </label><br>

            <label>
                <input type="radio" name="employmentType" value="contract">
                Contract
            </label>
        </fieldset>

        <label>
            <input type="checkbox" name="terms" required>
            I agree to the terms and conditions.
        </label><br><br>

        <button type="submit">Submit Application</button>
        <button type="submit" formnovalidate>Save Draft</button>
    </form>
</body>
</html>
