<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telephone Input</title>
</head>
<body>
  <form>
    <label for="phone">Phone Number:</label>
    <input
      id="phone"
      type="tel"
      pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
      placeholder="123-456-7890"
      required
    >
  </form>
</body>
</html>
