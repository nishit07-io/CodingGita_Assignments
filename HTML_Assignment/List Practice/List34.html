<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML List Types</title>
</head>
<body>
	<dl>
		<dt>Unordered List</dt>
		<dd>A list of items displayed with bullets when their order is not important.</dd>

		<dt>Ordered List</dt>
		<dd>A numbered list used when the sequence or ranking of items matters.</dd>

		<dt>Description List</dt>
		<dd>A list of terms and their corresponding descriptions, created with <code>&lt;dt&gt;</code> and <code>&lt;dd&gt;</code> elements.</dd>
	</dl>
</body>
</html>
