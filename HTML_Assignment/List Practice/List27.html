<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML List Elements</title>
</head>
<body>
  <h1>HTML List Elements</h1>
  <dl>
    <dt>Unordered List</dt>
    <dd>A list of items displayed with bullet points.</dd>

    <dt>Ordered List</dt>
    <dd>A list of items displayed in a specific sequence, usually with numbers.</dd>

    <dt>Description List</dt>
    <dd>A list of terms and their corresponding descriptions.</dd>
  </dl>
</body>
</html>
