<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Semantic Code Examples</title>
  </head>
  <body>
    <p>
      Use the <code>color</code> property to change the text color of an element.
    </p>

    <pre><code>body {
  color: #333;
  background: #fff;
}</code></pre>

    <p>
      Press <kbd>Ctrl</kbd> + <kbd>C</kbd> to copy the selected text.
    </p>

    <p>
      Example output: <samp>Error: file not found.</samp>
    </p>

    <p>
      The variable <var>count</var> stores the current number of items.
    </p>
  </body>
</html>
